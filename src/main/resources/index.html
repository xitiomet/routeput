<html>
<head>
  <script src="routeput.js"></script>
  <script src="index.js"></script>
  <style type="text/css">
    progress::-webkit-progress-bar {background-color: #fff; width: 100%;}
    progress {border: 1px solid black;}

   .radio-toolbar {
    margin: 5px;
    }

    .radio-toolbar input[type="radio"] {
      opacity: 0;
      position: fixed;
      width: 0;
    }

    .radio-toolbar label {
        display: inline-block;
        background-color: #ddd;
        padding: 5px 5px;
        font-family: sans-serif, Arial;
        font-size: 16px;
        border: 2px solid rgb(145, 139, 139);
        border-radius: 4px;
    }

    .radio-toolbar label:hover {
      background-color: #dfd;
    }

    .radio-toolbar input[type="radio"]:focus + label {
        border: 2px dotted #444;
        font-weight: bold;
    }

    .radio-toolbar input[type="radio"]:checked + label {
        background-color: #bfb;
        border-color: #4c4;
        font-weight: bold;
    }
    progress.blue{
      background-color:#1E90FF;
      color:#1E90FF;
    }
    progress.blue[value] {color:#1E90FF} /* IE10 */
    progress.blue::-webkit-progress-bar-value {background-color:#1E90FF}
    progress.blue::-webkit-progress-value {background-color:#1E90FF}
    progress.blue::-moz-progress-bar {background-color:#1E90FF}
    
    progress.green{
      background-color:#1c7a5b;
      color:#1c7a5b;
    }
    progress.green[value] {color:#1c7a5b} /* IE10 */
    progress.green::-webkit-progress-bar-value {background-color:#1c7a5b}
    progress.green::-webkit-progress-value {background-color:#1c7a5b}
    progress.green::-moz-progress-bar {background-color:#1c7a5b}
  
  </style>
</head>
<body style="background: white; background-size: 100% 100%; padding: 0px 0px 0px 0px; margin: 0px 0px 0px 0px;">
<div style="padding: 2px 2px 2px 2px; margin: 0px 0px 0px 0px; background: black; border: solid 1px black; color: white; position: fixed; top: 0; width: 100%; height: 42px;">
    <table width="100%"><tbody>
        <tr><td width="32px"><img src="icon-256.png" height="32" width="32"></td>
        <td style="color: white;" align="left"><a href="/" id="serverTitle" style="text-decoration: none; color: white; font-size: 20px;">Routeput Server</a></td>
        <td align="right"></td>
        </tr>
    </tbody></table>
</div>
<div id="channelStats" style="position: fixed; right: 20px; top: 60px; max-height: calc(100vh - 80px); overflow-y: auto; border: 1px black dotted; background-color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
    <table id="channelStatsTable" style="text-align: center; border-collapse: collapse;" cellpadding="5" cellspacing="0">
        <tr style="background-color: #CCCCCC; position: sticky; top: 0; z-index: 1;"><th>Channel</th><th></th><th>Members</th><th>Rx/s</th><th>Tx/s</th><th>ping</th></tr>
    </table>
</div>
<div id="console" style="width:99%; padding: 50px 5px 5px 5px; font-family: monospace; font-size: 10px; overflow-wrap: anywhere;">
    
</div>
<div id="adminAuthModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; padding: 20px 24px; border-radius: 6px; min-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); font-family: sans-serif;">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 12px;">Admin login required</div>
        <div id="adminAuthMessage" style="font-size: 12px; color: #666; margin-bottom: 12px;">Enter the admin password to view the routeputDebug channel.</div>
        <input type="password" id="adminAuthInput" style="width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box;" placeholder="Password" />
        <div id="adminAuthError" style="color: #b00; font-size: 12px; margin-top: 8px; display: none;"></div>
        <div style="margin-top: 14px; text-align: right;">
            <button id="adminAuthSubmit" style="padding: 6px 14px; font-size: 14px;">Sign in</button>
        </div>
    </div>
</div>
</body>
</html>
